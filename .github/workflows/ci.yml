name: SONI - validar frontend e API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Compilar React
        working-directory: frontend
        run: npm run build

  api:
    name: API PHP Slim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Validar Composer
        working-directory: api
        run: composer validate --no-check-publish
      - name: Instalar dependencias
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verificar sintaxe PHP
        working-directory: api
        run: |
          php -l public/index.php
          php -l src/AdminAuth.php
          php -l src/Http.php
          php -l tests/auth-smoke.php
          php -l src/Database.php
          php -l src/SiteRepository.php
          php -l src/SiteCms.php
          php -l src/SiteMedia.php
          php -r 'require "vendor/autoload.php"; if (!class_exists("Soni\\SiteMedia")) exit(1);'
          php -l tests/site-media-http-smoke.php
          php -l tests/site-cms-http-smoke.php
          php -l bin/migrate.php
          php -l bin/db-check.php
          php -l src/SiteMaintenance.php
          php -l src/QuizService.php
          php -l src/QuizFeedback.php
          php -l src/DocumentService.php
          php -l src/VideoService.php
          php -l tests/videos-http-smoke.php
          php -l tests/documents-http-smoke.php
          php -l tests/quiz-feedback-http-smoke.php
          php -l tests/quiz-http-smoke.php
          php -l bin/backup.php
          php -l bin/media-audit.php
          php -l tests/maintenance-smoke.php
          php -r 'require "vendor/autoload.php"; if (!class_exists("Soni\\SiteMaintenance")) exit(1);'
      - name: Testar autenticação
        working-directory: api
        run: php tests/auth-smoke.php

  database:
    name: Migração MariaDB 11.4
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_temporary_only
          MARIADB_DATABASE: plataforma_soni
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: plataforma_soni
      DB_USER: root
      DB_PASSWORD: ci_temporary_only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
      - name: Instalar dependências
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Aplicar migração
        working-directory: api
        run: php bin/migrate.php
      - name: Instalar cliente de dump MariaDB
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
      - name: Verificar banco e dados publicados
        working-directory: api
        run: php bin/db-check.php
      - name: Verificar idempotência
        working-directory: api
        run: php bin/migrate.php
      - name: Verificar filtro de publicação
        working-directory: api
        run: php tests/site-smoke.php
      - name: Testar HTTP GET /api/site e favicon
        working-directory: api
        run: |
          php -S 127.0.0.1:8282 -t public public/index.php > /tmp/soni-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8282/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8282/api/site -o /tmp/soni-site.json
          php -r '$data=json_decode(file_get_contents("/tmp/soni-site.json"),true); if (!is_array($data) || count($data["blocks"]??[])!==5 || ($data["settings"]["site_title"]??"")!=="SONI | Sonorização de Igrejas") { fwrite(STDERR,"Conteudo publico inesperado\n"); exit(1); } echo "GET /api/site OK\n";'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8282/favicon.ico)" = 204
      - name: Criar credenciais fictícias para o teste HTTP CMS
        working-directory: api
        run: php -r 'file_put_contents(".env", "ADMIN_EMAIL=ci@example.test\nADMIN_PASSWORD_HASH=" . password_hash("ci-password", PASSWORD_DEFAULT) . "\nJWT_SECRET=" . str_repeat("c", 64) . "\n");'
      - name: Testar CRUD CMS via HTTP com JWT
        working-directory: api
        run: |
          php -S 127.0.0.1:8282 -t public public/index.php > /tmp/soni-cms-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8282/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          php tests/site-cms-http-smoke.php
          php tests/site-media-http-smoke.php
          php tests/quiz-http-smoke.php
          php tests/quiz-feedback-http-smoke.php
          php tests/documents-http-smoke.php
          php tests/videos-http-smoke.php
      - name: Testar backup íntegro e quarentena segura
        working-directory: api
        run: |
          php tests/maintenance-smoke.php
          php bin/media-audit.php
